[project]
name = "hiron"
version = "0.1.0"
description = "Hiron — AI-Powered Hiring Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Hiron Engineering Team", email = "engineering@hiron.ai" }
]
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.7.0",
    "email-validator>=2.1.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.19",
    "pgvector>=0.2.5",
    "structlog>=24.2.0",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.8.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.4",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "spacy>=3.7.4",
    "openai>=1.30.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.4",
    "types-redis>=4.6.0.20240425",
    "types-requests>=2.31.0.20240406",
    "types-python-dateutil>=2.9.0.20240316",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/hiron"]

# ==============================================================================
# TOOL CONFIGURATIONS
# ==============================================================================

# Ruff Linter & Formatter Configuration
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api", "services/ai", "workers/celery"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # convention
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ASYNC", # flake8-async
    "S",   # flake8-bandit (security)
    "A",   # flake8-builtins
    "COM", # flake8-commas
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "EM",  # flake8-errmsg
    "FA",  # flake8-future-annotations
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "RUF"  # Ruff-specific rules
]
ignore = [
    "E501",   # Line too long (handled by Ruff Formatter)
    "B008",   # Do not perform function call in argument defaults (FastAPI Depends)
    "COM812", # Missing trailing comma
    "EM101",  # Exception must not use a string literal
    "EM102",  # Exception must not use an f-string literal
    "S104",   # Possible binding to all interfaces (container deployment)
    "S105",   # Hardcoded password string false positives (token_type="Bearer")
    "S106",   # Hardcoded password in function call
    "N803",   # Argument name should be lowercase (cookie parameters)
]

[tool.ruff.lint.isort]
known-first-party = ["hiron", "ai_service"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"apps/api/tests/**/*.py" = ["S101"]
"apps/api/alembic/**/*.py" = ["E402"]
"apps/api/hiron/common/exceptions.py" = ["N818"]
"apps/api/hiron/common/schemas.py" = ["UP046"]
"scripts/*.py" = ["T201", "E402"]

# MyPy Strict Mode Configuration (§3.1)
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
implicit_reexport = false
strict_equality = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "spacy.*",
    "pdfplumber.*",
    "docx.*",
    "celery.*",
    "pgvector.*"
]
ignore_missing_imports = true

# Pytest Configuration
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "apps/api/tests",
    "services/ai/tests"
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers --strict-config"
asyncio_mode = "auto"
