name: Lint & Format Workflow

on:
  workflow_call:

jobs:
  python-lint:
    name: Python Formatting & Linter Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        run: uv sync --all-extras

      - name: Check Ruff Formatter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify "$BASE_SHA" >/dev/null 2>&1; then
            BASE_SHA="HEAD~1"
          fi

          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" HEAD | grep '\.py$' || true)

          if [ -n "$CHANGED_FILES" ]; then
            echo "$CHANGED_FILES" | xargs uv run ruff format --check
          else
            echo "No Python files changed. Skipping formatter."
          fi

      - name: Check Ruff Linter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify "$BASE_SHA" >/dev/null 2>&1; then
            BASE_SHA="HEAD~1"
          fi

          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" HEAD | grep '\.py$' || true)

          if [ -n "$CHANGED_FILES" ]; then
            echo "$CHANGED_FILES" | xargs uv run ruff check
          else
            echo "No Python files changed. Skipping linter."
          fi

      - name: Run MyPy Strict Check
        run: uv run mypy apps/api

  node-format:
    name: Node Workspace & Formatting Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Prettier Formatting
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git rev-parse --verify "$BASE_SHA" >/dev/null 2>&1; then
            BASE_SHA="HEAD~1"
          fi

          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" HEAD | grep -E '\.(json|yaml|yml|md|ts|tsx|js|jsx)$' || true)

          if [ -n "$CHANGED_FILES" ]; then
            echo "$CHANGED_FILES" | xargs npx prettier --check
          else
            echo "No Prettier files changed. Skipping formatter."
          fi
