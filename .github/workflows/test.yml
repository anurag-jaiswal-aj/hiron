name: Test Workflow

on:
  workflow_call:

jobs:
  python-tests:
    name: PyTest Application Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hiron_dev
          POSTGRES_USER: hiron_user
          POSTGRES_PASSWORD: hiron_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://hiron_user:hiron_secure_password@localhost:5432/hiron_dev
      POSTGRES_PASSWORD: hiron_secure_password
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        run: uv sync --all-extras

      - name: Wait for PostgreSQL
        run: |
          while ! pg_isready -h localhost -p 5432 -U hiron_user; do
            echo "Waiting for postgres..."
            sleep 1
          done

      - name: Initialize Database
        run: |
          uv run alembic -c apps/api/alembic.ini upgrade head

      - name: Run PyTest Suite
        run: uv run pytest --cov=hiron --cov-fail-under=80

  frontend-unit:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest Suite
        run: pnpm --filter @hiron/web test:unit

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter @hiron/web exec playwright install --with-deps

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Create CI environment file
        run: |
          mkdir -p keys
          openssl genrsa -out keys/jwt_private.pem 2048
          openssl rsa -in keys/jwt_private.pem -outform PEM -pubout -out keys/jwt_public.pem
          touch .env.local
          echo "DATABASE_URL=postgresql+asyncpg://hiron_user:hiron_secure_password@postgres:5432/hiron_dev" >> .env.local
          echo "POSTGRES_USER=hiron_user" >> .env.local
          echo "POSTGRES_PASSWORD=hiron_secure_password" >> .env.local
          echo "POSTGRES_DB=hiron_dev" >> .env.local

      - name: Start backend infrastructure
        run: docker compose up -d postgres redis api

      - name: Wait for API health
        run: |
          while ! curl -s http://localhost:8000/api/v1/health | grep -q "healthy"; do
            echo "Waiting for API..."
            sleep 2
          done

      - name: Initialize Database
        env:
          DATABASE_URL: postgresql+asyncpg://hiron_user:hiron_secure_password@localhost:5432/hiron_dev
        run: |
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run python scripts/init-db.py
          uv run python scripts/seed.py

      - name: Run Playwright E2E Tests
        run: |
          set +e
          PROJECTS=("chromium" "firefox" "webkit" "msedge" "mobile-chrome" "mobile-safari" "tablet")
          EXIT_CODE=0

          for PROJECT in "${PROJECTS[@]}"; do
            echo "========================================================"
            echo "Running E2E Project: $PROJECT"
            echo "========================================================"

            pnpm --filter @hiron/web test:e2e --workers=1 --project="$PROJECT"
            PROJECT_EXIT=$?

            if [ $PROJECT_EXIT -ne 0 ]; then
              echo "::error::Project $PROJECT failed!"
              EXIT_CODE=$PROJECT_EXIT
            fi

            echo "Restarting Celery worker to release accumulated memory..."
            docker compose restart worker

            # Brief pause to ensure worker is ready
            sleep 2
          done

          exit $EXIT_CODE
