name: CI Pipeline

on:
  push:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Configuration & Formatting Checks
    uses: ./.github/workflows/lint.yml

  test:
    name: Application Test Suite Checks
    uses: ./.github/workflows/test.yml
    needs: [lint]

  docker-build:
    name: Docker Container Infrastructure Build Check
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Core API Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          tags: hiron-api:latest

      - name: Build AI Service Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.ai
          push: false
          tags: hiron-ai:latest

      - name: Build Web Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          tags: hiron-web:latest
