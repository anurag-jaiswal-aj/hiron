name: CI Pipeline

on:
  push:
    branches: [main, phase-0-scaffolding]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Configuration & Formatting Checks
    uses: ./.github/workflows/lint.yml

  docker-build:
    name: Docker Container Infrastructure Build Check
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Core API Container Skeleton
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          tags: hiron-api:skeleton

      - name: Build AI Service Container Skeleton
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.ai
          push: false
          tags: hiron-ai:skeleton

      - name: Build Web Frontend Container Skeleton
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          tags: hiron-web:skeleton
